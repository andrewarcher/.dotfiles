- defaults:
    link:
      relink: true

- clean: ['~', '~/.config']

- link:
    # ~/.tmux.conf: tmux.conf
    ~/.zshrc: target/zshrc
    ~/.inputrc: target/inputrc
    ~/.config/vim: target/vim
    ~/.config/nvim: target/nvim
    ~/.config/zsh: target/zsh
    ~/.config/git: target/git
    ~/.config/ghostty: target/ghostty
    ~/.config/lsd: target/lsd
    ~/.config/finicky.ts: target/finicky.ts

- create:
    - ~/.cache/less

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [touch ~/.config/env_keys, Creating ~/.config/env_keys]
  - [scripts/homebrew.sh, Installing homebrew]
  - [scripts/brewfile.sh, Installing Brewfile packages]
