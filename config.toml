# Global mise configuration. This repository *is* `$MISE_CONFIG_DIR`
# (`~/.config/mise`), which is what makes `[tools]` below global: every tool is
# on PATH everywhere, and any project with its own `mise.toml` overrides the
# version for that directory. See README.md for how a new machine is set up.
#
# `mise bootstrap` applies everything here in one pass. Phases run in a fixed
# order -- packages, repos, dotfiles, shell activation, macOS defaults, tools,
# then the `bootstrap` task -- so later phases can rely on earlier ones.

[settings]
# `mise dot add <path>` writes new sources here rather than into the default
# `~/.dotfiles`, so an adopted file lands next to the ones already committed.
dotfiles.root = "~/.config/mise/dotfiles"

##
## shell activation
##

[bootstrap.mise_shell_activate]
# Login shells get the shim farm on PATH. That covers every process that
# inherits a login environment but never displays a prompt -- GUI apps, and
# nvim spawning language servers -- which plain `mise activate` cannot reach.
#
# Interactive shells additionally get real PATH activation, from the
# `mise activate zsh` line in dotfiles/zshrc. That puts resolved tool paths
# *ahead* of the shims, so interactive use pays no shim dispatch cost and still
# picks up mise's env vars. mise skips generating its own zshrc block because
# `[dotfiles]` below already owns that file.
zprofile = "shims"

##
## packages
##

# mise pours homebrew/core bottles and casks into /opt/homebrew itself -- it
# never shells out to `brew` and does not need Homebrew installed. That is why
# there is no Homebrew installer script here any more. Formulae poured by mise
# and by a real Homebrew are mutually legible, so an existing brew install
# keeps working.
#
# Only things mise has no tool backend for belong here. Anything with a backend
# goes in `[tools]` so projects can override its version.

[bootstrap.brew]
# Claim the apps already installed on this machine instead of replacing their
# bundles. Replacing an .app resets its macOS Privacy & Security grants
# (Accessibility, Screen Recording, ...), which these apps all need.
adopt = true

[bootstrap.packages]
# Distributed revision control system -- also what clones this repo, so a fresh
# machine needs Xcode's command line tools git until this one is poured.
"brew:git" = "latest"
# Improved top (interactive process viewer)
"brew:htop" = "latest"
# Executes a program periodically, showing output fullscreen
"brew:watch" = "latest"
# Internet file retriever
"brew:wget" = "latest"

# Menu bar calendar app. The plain token deliberately, not the
# pakerwreah/calendr tap this used to come from: CalendR is in homebrew/cask
# now, so it resolves from published API metadata. The tap publishes none, which
# sent mise to evaluate its Casks/calendr.rb through mise's own Cask DSL shim --
# needing Ruby 3+ during the packages phase, which is phase 3, long before
# [tools] install in phase 15. No tool declaration can be early enough, so the
# fix is to not need one.
"brew-cask:calendr" = "latest"
# Utility for customizing which browser to start -- configured by dotfiles/finicky.ts
"brew-cask:finicky" = "latest"
# Terminal emulator that uses platform-native UI and GPU acceleration
"brew-cask:ghostty" = "latest"
# Utility to customise mouse and trackpad behaviour
"brew-cask:linearmouse" = "latest"
# Adaptive brightness for external displays
"brew-cask:lunar" = "latest"

##
## vendored checkouts
##

# These replace what used to be git submodules. Paths must be absolute in a
# global config, which is fine -- the adopt install fixes this repo at
# ~/.config/mise. Both are gitignored; bootstrap clones them, and
# `mise bootstrap repos update` fast-forwards them.
[bootstrap.repos]
# Completion menu for zsh, sourced by dotfiles/zshrc
"~/.config/mise/dotfiles/zsh/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab.git" }
# Per-server LSP definitions, loaded by nvim's native packpath
"~/.config/mise/dotfiles/nvim/pack/plugins/start/nvim-lspconfig" = { url = "https://github.com/neovim/nvim-lspconfig.git" }

##
## dotfiles
##

# Symlink mode, so editing the live path edits the file in this repo. Sources
# are relative to this config file, i.e. to ~/.config/mise.
[dotfiles]
"~/.zshrc" = { source = "dotfiles/zshrc" }
"~/.inputrc" = { source = "dotfiles/inputrc" }
"~/.config/zsh" = { source = "dotfiles/zsh" }
"~/.config/nvim" = { source = "dotfiles/nvim" }
"~/.config/git" = { source = "dotfiles/git" }
"~/.config/ghostty" = { source = "dotfiles/ghostty" }
"~/.config/lsd" = { source = "dotfiles/lsd" }
"~/.config/linearmouse" = { source = "dotfiles/linearmouse" }
"~/.config/finicky.ts" = { source = "dotfiles/finicky.ts" }

##
## macOS defaults
##

# Unlike CalendR's settings, this domain is a plain file in
# ~/Library/Preferences rather than an app sandbox container, so mise's own
# defaults writer reaches it and no task is needed. See calendr/sync.py for why
# a sandboxed app cannot be done this way.
#
# The menu bar clock shows the time only: CalendR supplies the date, in the
# format set by calendr/defaults.toml. Changing anything here takes effect after
# `killall SystemUIServer ControlCenter` or a log out -- deliberately not a
# bootstrap hook, which would restart the menu bar on every run.
[bootstrap.macos.defaults."com.apple.menuextra.clock"]
# 0 shows the date when there is room, 1 always, 2 never. Never, because CalendR
# already shows it and two dates in one menu bar is one too many.
ShowDate = 2
ShowDayOfWeek = false
# Minutes and seconds, 24-hour. The 24-hour switch itself is the NSGlobalDomain
# key below, not this one -- ShowAMPM only decides whether an AM/PM suffix is
# drawn, so on its own it would leave a 12-hour clock with no way to tell 2am
# from 2pm. Under forced 24-hour it is inert; false states the intent and stops
# AM/PM reappearing if the clock ever went back to 12-hour.
ShowSeconds = true
ShowAMPM = false
# Digital, and no blinking ":" between the digits.
IsAnalog = false
FlashDateSeparators = false

# The actual 24-hour clock, and what System Settings > General > Date & Time >
# "24-hour time" writes. It is system-wide rather than menu-bar-only: every
# app's short and medium time formatting follows it. macOS offers no menu-bar-
# only equivalent.
#
# It has to be declared because the locale does not imply it -- AppleLocale here
# is en_CA, which formats 12-hour by default, so without this a new machine
# comes up showing "2:00:47 PM".
[bootstrap.macos.defaults.NSGlobalDomain]
AppleICUForce24HourTime = true

# Menu bar layout. Right to left: clock, Control Center, CalendR's date,
# battery, volume, bluetooth.
#
# `NSStatusItem Preferred Position <item>` is points from the right edge, so
# ascending values read right to left. The clock has no position key at all --
# macOS pins it rightmost and it cannot be moved, which is the answer to
# whether Control Center can be reordered past it: it cannot either, in
# practice, so it sits where macOS puts it at 83.
#
# CalendR's date sits between Control Center and the battery, at 125. Its slot
# is deliberately *not* declared: that key lives in CalendR's own sandboxed
# domain and is excluded by calendr/sync.py as machine-specific, since these
# are coordinates tuned to one menu bar's set of items. On a new machine
# CalendR picks its own slot and may need dragging once.
#
# Declaring positions means bootstrap restores this order, so an item dragged
# somewhere else moves back on the next run. That is the intent here; the
# alternative is not declaring them and accepting whatever each machine does.
[bootstrap.macos.defaults."com.apple.controlcenter"]
# Control Center itself, immediately left of the clock. Both keys, because
# macOS writes the suffixed one too.
"NSStatusItem Preferred Position BentoBox" = 83.0
"NSStatusItem Preferred Position BentoBox-0" = 83.0
"NSStatusItem Preferred Position Battery" = 218.0
"NSStatusItem Preferred Position Sound" = 260.0
"NSStatusItem Preferred Position Bluetooth" = 298.0
"NSStatusItem Visible BentoBox" = true

# Shortcuts has no module mode of its own, so this flag is the only lever for it.
#
# AirDrop, Now Playing and Music Recognition used to be listed here too. They
# are hidden by their mode below instead, which is the actual mechanism; the
# flag only recorded that they were already hidden. FocusModes and
# ScreenMirroring were pinned false here as well, which was worse than
# redundant: both are "show when active", so a false pin would have fought the
# moment either condition fired. The flag reads as macOS's record of whether a
# conditional item is showing right now -- everything set to always-show has no
# such key at all -- so it is left to macOS except where nothing else works.
"NSStatusItem Visible Shortcuts" = false

# The module modes these items run in. Per host, like the battery percentage
# below -- `defaults -currentHost` is required to read or write them, which the
# CIS Benchmark for macOS Sonoma also specifies.
#
# The three values in use here, settled by reading them back after changing each
# item in System Settings > Menu Bar:
#
#   18  always show in the menu bar
#    2  show when active
#    8  never show
#
# 18 is the canonical always-show value -- what the CIS benchmark prescribes for
# Bluetooth and what an MDM com.apple.controlcenter payload uses. Apple
# documents none of them, and no published mapping of the remaining values
# exists; nix-darwin declined to model these keys for that reason. 2 is why
# bluetooth appeared to contradict the earlier reading of these numbers: it was
# "show when active" and bluetooth was simply active.
#
# This machine had arrived at Battery = 3 and Bluetooth = 2 through the
# Control Center UI. Both displayed, but they look like residue of particular
# UI interactions rather than values worth reproducing, so both are normalised
# to 18. Verified by setting them, restarting Control Center and reading the
# drawn items back through the accessibility API: the same five items in the
# same order, with the battery percentage intact.
#
# Screen Mirroring is absent from this list deliberately: it has no per-host
# mode key even after being set to "show when active", so there is nothing to
# declare. It appears to be that mode's default.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "Battery"
host = "current"
value = 18

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "Sound"
host = "current"
value = 18

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "Bluetooth"
host = "current"
value = 18

# Shown only while in use, rather than permanently.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "Display"
host = "current"
value = 2

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "FocusModes"
host = "current"
value = 2

# Explicitly never shown.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "WiFi"
host = "current"
value = 8

# Spotlight's magnifying glass. Not a Control Center module at all: it is drawn
# by its own process and controlled by this legacy per-host key, where true
# hides it. Found by snapshotting preferences, toggling the item in System
# Settings > Menu Bar, and diffing -- `MenuItemHidden` was the key that tracked
# the change, flipping 1 -> 0 as it appeared.
#
# Enabling it also made a `Spotlight = 2` key appear under
# com.apple.controlcenter, but that one is not the lever: hiding Spotlight again
# left it sitting at 2 regardless, so it is residue rather than state and is not
# declared here.
#
# Unverifiable from a shell, unlike the Control Center items: Spotlight's menu
# bar items report an AXPosition of {0, 30} whether shown or hidden, the same as
# third-party status items.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.Spotlight"
key = "MenuItemHidden"
host = "current"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "AirDrop"
host = "current"
value = 8

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "NowPlaying"
host = "current"
value = 8

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "MusicRecognition"
host = "current"
value = 8

# Battery percentage as a number beside the menu bar icon.
#
# This one needs the `defaults_entries` array form rather than a
# `[bootstrap.macos.defaults."domain"]` table, because Control Center stores it
# per host: the real file is
# ~/Library/Preferences/ByHost/com.apple.controlcenter.<hardware UUID>.plist,
# not the any-host com.apple.controlcenter.plist. `host = "current"` is mise's
# equivalent of `defaults -currentHost`, and resolves to whichever machine is
# running bootstrap, so the UUID never needs naming here.
#
# Writing it to the any-host domain instead would be accepted and ignored --
# the same class of silent miss as writing a sandboxed app's prefs outside its
# container.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "BatteryShowPercentage"
host = "current"
value = true

##
## tools
##

# Global because this file is the global config. A project that pins its own
# version in `mise.toml` wins inside that directory -- which is the whole point
# of moving these off Homebrew.
[tools]

## language toolchains
go = "latest"
node = "lts"
python = "latest"
# Also the installer mise uses for the `pipx:` backend below.
uv = "latest"

## shell and CLI
direnv = "latest"
# Used by dotfiles/zshrc for FZF_DEFAULT_COMMAND. The old Brewfile never
# installed it, so that setting was silently broken on a fresh machine.
fd = "latest"
fzf = "latest"
lsd = "latest"
neovim = "latest"

## git
git-lfs = "latest"
# The default `gitlab:` backend reads the GitLab release API, which answers 401
# unauthenticated. The asdf plugin downloads the release asset directly.
"asdf:mise-plugins/mise-glab" = "latest"

## containers and kubernetes
# colima shells out to `limactl`, and nothing declares that dependency for it
# (Homebrew's formula did), so lima is listed explicitly.
colima = "latest"
lima = "latest"
docker-cli = "latest"
k9s = "latest"
# Was pinned to 1.23.14 in a leftover ~/.tool-versions from asdf days. A 1.23
# client is far outside kubectl's +/-1 minor skew policy against any current
# cluster, so it tracks latest now; pin it here if a cluster ever needs an older
# client.
kubectl = "latest"
# Two registry entries out of one upstream repo; `kubectx` alone does not
# provide `kubens`.
kubectx = "latest"
kubens = "latest"

## language servers -- see README.md for how nvim resolves these per project
"go:golang.org/x/tools/gopls" = "latest"
"npm:typescript-language-server" = "latest"
"pipx:basedpyright" = "latest"
ruff = "latest"

## hooks
pre-commit = "latest"

##
## everything with no declarative equivalent
##

[tasks.bootstrap]
description = "Machine setup that no bootstrap section covers"
# tasks/calendr-defaults writes CalendR's preferences. It is a task rather than
# a `[bootstrap.macos.defaults]` block because CalendR is sandboxed -- see the
# comment at the top of that file.
depends = ["calendr-defaults"]
run = """
# dotfiles/zshrc points LESSHISTFILE inside this directory; less will not
# create the parent itself.
mkdir -p ~/.cache/less

# Per-machine secrets, deliberately not in this repo -- dotfiles/zshrc sources
# it when present. Created empty and 0600 so there is an obvious place to put
# keys; never overwritten, so re-running bootstrap cannot lose them.
[ -e ~/.config/env_keys ] || install -m 600 /dev/null ~/.config/env_keys
"""
